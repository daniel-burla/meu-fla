<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Fla</title>
<meta name="description" content="Jogos, resultados, tabela e notícias do Flamengo">
<meta name="theme-color" content="#c3000d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meu Fla">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --vermelho:#e01020; --vermelho-escuro:#c3000d;
  --fundo:#0a0a0b; --superficie:#141417; --superficie-2:#1c1c21;
  --borda:#2a2a31; --texto:#f2f2f4; --texto-fraco:#9a9aa5;
  --verde:#2fbf6a; --amarelo:#e8b021; --azul:#3b8ad9;
  --raio:16px;
  --topo:env(safe-area-inset-top); --base:env(safe-area-inset-bottom);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--fundo); color:var(--texto);
  font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:contain;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- cabeçalho ---------- */
header{
  position:sticky; top:0; z-index:20;
  padding:calc(var(--topo) + 14px) 16px 12px;
  background:linear-gradient(180deg,var(--vermelho-escuro),#8c0009);
  border-bottom:1px solid rgba(0,0,0,.4);
}
.marca{display:flex;align-items:center;gap:10px}
.marca img{width:36px;height:36px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.55))}
.marca h1{margin:0;font-size:20px;letter-spacing:.4px;font-weight:800}
.atualizado{margin:8px 0 0;font-size:11px;color:rgba(255,255,255,.68)}
.btn-atualizar{
  margin-left:auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
  -webkit-tap-highlight-color:transparent;
}
.btn-atualizar svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
.btn-atualizar:active{transform:scale(.92);background:rgba(255,255,255,.24)}
.btn-atualizar.girando svg{animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

/* ---------- conteúdo ---------- */
main{padding:16px 16px calc(84px + var(--base))}
.painel{display:none}
.painel.ativo{display:block;animation:entra .18s ease-out}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2.secao{
  margin:26px 0 12px;font-size:13px;font-weight:700;letter-spacing:1.1px;
  text-transform:uppercase;color:var(--texto-fraco);
}
h2.secao:first-child{margin-top:4px}

/* ---------- card do próximo jogo ---------- */
.destaque{
  border-radius:var(--raio); padding:20px 18px; margin-bottom:8px;
  background:radial-gradient(120% 130% at 0% 0%,#2a0206 0%,var(--superficie) 55%);
  border:1px solid var(--borda); position:relative; overflow:hidden;
}
.destaque::before{
  content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--vermelho);
}
.destaque .etiqueta{
  font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--vermelho);
}
.destaque .campeonato{font-size:12px;color:var(--texto-fraco);margin-top:2px}
.confronto{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px 0 14px}
.lado{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.lado img{width:52px;height:52px;object-fit:contain}
.lado .nome{font-size:13px;font-weight:600;line-height:1.2}
.versus{font-size:13px;font-weight:700;color:var(--texto-fraco)}
.quando{text-align:center;font-size:15px;font-weight:600}
.quando .local{display:block;font-size:12px;font-weight:400;color:var(--texto-fraco);margin-top:4px}
.contagem{
  margin-top:14px;display:flex;justify-content:center;gap:10px;
}
.contagem div{
  background:var(--superficie-2);border:1px solid var(--borda);border-radius:10px;
  padding:8px 12px;min-width:58px;text-align:center;
}
.contagem b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.contagem span{font-size:10px;color:var(--texto-fraco);text-transform:uppercase;letter-spacing:.6px}
.ao-vivo{
  display:inline-flex;align-items:center;gap:6px;background:var(--vermelho);
  padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.5px;
}
.ao-vivo::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:pisca 1.1s infinite}
@keyframes pisca{50%{opacity:.25}}

/* ---------- linhas de jogo ---------- */
.lista{display:flex;flex-direction:column;gap:8px}
.jogo{
  display:flex;align-items:center;gap:12px;padding:12px 14px;
  background:var(--superficie);border:1px solid var(--borda);border-radius:12px;
}
.jogo .data{width:52px;flex:none;text-align:center}
.jogo .data b{display:block;font-size:17px;font-weight:800;line-height:1}
.jogo .data span{font-size:10px;color:var(--texto-fraco);text-transform:uppercase}
.jogo .meio{flex:1;min-width:0}
.jogo .times{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jogo .info{font-size:11px;color:var(--texto-fraco);margin-top:3px}
.jogo .placar{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.selo{
  width:22px;height:22px;flex:none;border-radius:6px;display:grid;place-items:center;
  font-size:11px;font-weight:800;color:#fff;
}
.selo.v{background:var(--verde)} .selo.e{background:#6b6b78} .selo.d{background:var(--vermelho)}
.escudo-mini{width:20px;height:20px;object-fit:contain;vertical-align:-4px;margin-right:6px}

/* mando de campo: (C) em casa, (F) fora */
.mando{font-size:12px;font-weight:600;color:var(--texto-fraco);margin-left:5px}

/* ---------- chips de fonte ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;
  background:var(--superficie);border:1px solid var(--borda);color:var(--texto-fraco);
  transition:background .15s,color .15s,border-color .15s;
}
.chip[aria-pressed="true"]{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
.bloco-campeonato{display:none}
.bloco-campeonato.ativo{display:block}

/* ---------- notícia ---------- */
.noticia{
  display:block;padding:14px;background:var(--superficie);
  border:1px solid var(--borda);border-radius:12px;
}
.noticia:active{background:var(--superficie-2)}
.noticia .cabeca{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.fonte{font-size:11px;font-weight:700;color:var(--vermelho);text-transform:uppercase;letter-spacing:.5px}
.tempo{font-size:11px;color:var(--texto-fraco)}
.tempo::before{content:"·";margin-right:8px}
.noticia h3{margin:0;font-size:15px;font-weight:600;line-height:1.35}
.noticia p{margin:6px 0 0;font-size:13px;color:var(--texto-fraco);line-height:1.4}

/* notícia já lida: apaga o texto, mantém o card no lugar */
.noticia.lida h3{color:var(--texto-fraco);font-weight:500}
.noticia.lida .fonte{color:var(--texto-fraco)}
.noticia.lida p{opacity:.6}

/* marcador de lida: círculo à direita do cabeçalho */
.marca-lida{
  width:40px;height:40px;margin:-10px -8px -10px auto;
  display:grid;place-items:center;flex:none;
  -webkit-tap-highlight-color:transparent;
}
.marca-lida::after{
  content:"";width:13px;height:13px;border-radius:50%;
  border:1.5px solid var(--borda);transition:background .15s,border-color .15s;
}
.noticia.lida .marca-lida::after{background:var(--texto-fraco);border-color:var(--texto-fraco)}
.marca-lida:active::after{transform:scale(.85)}

/* ---------- tabela de pontos ---------- */
.tabela{
  width:100%;border-collapse:separate;border-spacing:0;font-size:13px;font-variant-numeric:tabular-nums;
  background:var(--superficie);border:1px solid var(--borda);border-radius:12px;overflow:hidden;
}
.tabela th,.tabela td{padding:8px 5px;text-align:right;white-space:nowrap}
.tabela th{
  font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--texto-fraco);
  padding:9px 5px 6px;border-bottom:1px solid var(--borda);
}
.tabela tbody tr+tr td{border-top:1px solid var(--borda)}
.tabela .pos{width:30px;text-align:center;font-weight:700;color:var(--texto-fraco);border-left:3px solid transparent;padding-left:4px}
.tabela .time{text-align:left;width:100%;max-width:0;overflow:hidden;text-overflow:ellipsis}
.tabela .p{font-weight:800}
.tabela tr.fla td{background:rgba(224,16,32,.12)}
.tabela tr.fla .time{font-weight:700}
.tabela tr.fla .pos{color:var(--texto)}
.tabela tr.z-liberta .pos{border-left-color:var(--verde)}
.tabela tr.z-pre .pos{border-left-color:rgba(47,191,106,.45)}
.tabela tr.z-sula .pos{border-left-color:var(--azul)}
.tabela tr.z-queda .pos{border-left-color:var(--vermelho)}
.legenda{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 2px 0;font-size:11px;color:var(--texto-fraco)}
.legenda span::before{
  content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;
  vertical-align:-1px;background:var(--cor);
}

/* ---------- mata-mata ---------- */
.rodada{
  margin:18px 0 8px;font-size:12px;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;color:var(--texto-fraco);
}
.rodada:first-child{margin-top:0}
details.fase{margin:18px 0 8px}
details.fase summary{list-style:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
details.fase summary::-webkit-details-marker{display:none}
details.fase .rodada{margin:0;display:flex;align-items:center;gap:8px}
details.fase .rodada .estado{font-weight:500;letter-spacing:0;text-transform:none;font-size:11px}
details.fase .rodada::after{content:"›";margin-left:auto;font-size:18px;line-height:1;transition:transform .15s}
details.fase[open] .rodada::after{transform:rotate(90deg)}
details.fase[open] summary{margin-bottom:8px}
.chave{
  position:relative;overflow:hidden;padding:9px 14px 10px 16px;margin-bottom:8px;
  background:var(--superficie);border:1px solid var(--borda);border-radius:12px;
}
.chave.fla::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--vermelho)}
.chave .time{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px;font-weight:600}
.chave .time img,.chave .time .vazio{width:22px;height:22px;flex:none;object-fit:contain}
.chave .time .vazio{border-radius:50%;border:1.5px dashed var(--borda)}
.chave .time .nome{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chave .time.tbd .nome{color:var(--texto-fraco);font-weight:500}
.chave .time.fora{color:var(--texto-fraco);font-weight:500}
.chave .time.passou{font-weight:800}
.chave .placar-jogo{width:30px;text-align:center;font-size:13px;color:var(--texto-fraco);font-variant-numeric:tabular-nums}
.chave .agg{width:34px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.chave .rotulos{padding:0 0 2px}
.chave .rotulos .placar-jogo,.chave .rotulos .agg{
  font-size:9px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--texto-fraco);
}
.chave .nota{margin-top:5px;font-size:11px;color:var(--texto-fraco);display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- abas ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:grid;grid-template-columns:repeat(3,1fr);
  padding-bottom:var(--base);
  background:rgba(16,16,19,.92);backdrop-filter:saturate(180%) blur(18px);
  border-top:1px solid var(--borda);
}
nav button{
  padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10px;font-weight:600;color:var(--texto-fraco);letter-spacing:.3px;
}
nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"]{color:var(--vermelho)}

/* ---------- estados ---------- */
.aviso{padding:28px 14px;text-align:center;color:var(--texto-fraco);font-size:14px}
.esqueleto{height:74px;border-radius:12px;background:var(--superficie);
  animation:pulsa 1.3s ease-in-out infinite}
@keyframes pulsa{50%{opacity:.45}}
</style>
</head>
<body>

<header>
  <div class="marca">
    <img src="icons/escudo.png" alt="Escudo do Flamengo">
    <h1>Meu Fla</h1>
    <button class="btn-atualizar" id="btnAtualizar" aria-label="Atualizar">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4.6h-4.6"/></svg>
    </button>
  </div>
  <p class="atualizado" id="atualizadoEm">Carregando…</p>
</header>

<main>
  <!-- ===== JOGOS ===== -->
  <section class="painel ativo" id="painel-jogos">
    <div id="proximoJogo"><div class="esqueleto" style="height:230px"></div></div>
    <h2 class="secao">Próximos jogos</h2>
    <div class="lista" id="listaProximos"><div class="esqueleto"></div><div class="esqueleto"></div></div>
    <h2 class="secao">Últimos resultados</h2>
    <div class="lista" id="listaResultados"><div class="esqueleto"></div><div class="esqueleto"></div></div>
  </section>

  <!-- ===== TABELA ===== -->
  <section class="painel" id="painel-tabela">
    <div class="chips" id="chipsCampeonato">
      <button class="chip" aria-pressed="true" data-campeonato="brasileirao">Brasileirão</button>
      <button class="chip" aria-pressed="false" data-campeonato="libertadores">Libertadores</button>
    </div>
    <div class="bloco-campeonato ativo" id="campeonato-brasileirao">
      <div id="tabelaBrasileirao"><div class="esqueleto" style="height:420px"></div></div>
    </div>
    <div class="bloco-campeonato" id="campeonato-libertadores">
      <h2 class="secao" id="tituloLibertadores" hidden></h2>
      <div id="tabelaLibertadores"><div class="esqueleto" style="height:140px"></div></div>
    </div>
  </section>

  <!-- ===== NOTÍCIAS ===== -->
  <section class="painel" id="painel-noticias">
    <div class="chips" id="chipsFontes"></div>
    <div class="lista" id="listaNoticias"><div class="esqueleto"></div><div class="esqueleto"></div><div class="esqueleto"></div></div>
  </section>

</main>

<nav role="tablist">
  <button role="tab" aria-selected="true" data-painel="jogos">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v4M12 17v4M3.5 9l3.7 2.6M16.8 11.6l3.7-2.6M6.6 19l1.5-4M15.9 15l1.5 4"/></svg>
    Jogos
  </button>
  <button role="tab" aria-selected="false" data-painel="tabela">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9.5h18M3 14.5h18M9 9.5V20"/></svg>
    Tabela
  </button>
  <button role="tab" aria-selected="false" data-painel="noticias">
    <svg viewBox="0 0 24 24"><path d="M4 5h13v14H6a2 2 0 0 1-2-2z"/><path d="M17 8h3v9a2 2 0 0 1-2 2h-1"/><path d="M7.5 9h6M7.5 12.5h6M7.5 16h4"/></svg>
    Notícias
  </button>
</nav>

<script>
"use strict";

const FLAMENGO_ID = "819";
const LIGAS = [
  { slug: "bra.1", nome: "Brasileirão" },
  { slug: "conmebol.libertadores", nome: "Libertadores" },
  { slug: "bra.copa_do_brazil", nome: "Copa do Brasil" },
];
const ESCUDO_FLA = "https://a.espncdn.com/i/teamlogos/soccer/500/819.png";

/* ---------- utilidades ---------- */
const $ = (sel) => document.querySelector(sel);

const fmtDiaMes = new Intl.DateTimeFormat("pt-BR", { day: "2-digit", month: "short" });
const fmtCompleto = new Intl.DateTimeFormat("pt-BR", { weekday: "long", day: "numeric", month: "long" });
const fmtHora = new Intl.DateTimeFormat("pt-BR", { hour: "2-digit", minute: "2-digit" });

function tempoRelativo(iso) {
  if (!iso) return "";
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (min < 1) return "agora";
  if (min < 60) return `há ${min} min`;
  const h = Math.round(min / 60);
  if (h < 24) return `há ${h} h`;
  const d = Math.round(h / 24);
  if (d < 30) return `há ${d} ${d === 1 ? "dia" : "dias"}`;
  return fmtDiaMes.format(new Date(iso));
}

function mando(emCasa) {
  return `<span class="mando">(${emCasa ? "C" : "F"})</span>`;
}

function esc(txt) {
  const d = document.createElement("div");
  d.textContent = txt ?? "";
  return d.innerHTML;
}

/* ---------- ESPN: jogos ---------- */
function normalizaEvento(ev, ligaNome) {
  const c = ev.competitions?.[0];
  if (!c) return null;
  const fla = c.competitors.find((t) => t.team?.id === FLAMENGO_ID);
  const adv = c.competitors.find((t) => t.team?.id !== FLAMENGO_ID);
  if (!fla || !adv) return null;
  const st = c.status?.type || {};
  const gol = (t) => {
    const s = t.score;
    if (s == null) return null;
    if (typeof s === "object") return s.displayValue ?? String(s.value ?? "");
    return String(s);
  };
  return {
    id: ev.id,
    data: c.date || ev.date,
    liga: ligaNome,
    estado: st.state,                        // pre | in | post
    detalhe: c.status?.displayClock || "",
    periodo: c.status?.period || 0,
    casa: fla.homeAway === "home",
    local: c.venue?.fullName || "",
    cidade: c.venue?.address?.city || "",
    fla: { nome: "Flamengo", escudo: ESCUDO_FLA, gols: gol(fla), venceu: fla.winner },
    adv: {
      nome: adv.team.shortDisplayName || adv.team.displayName,
      escudo: adv.team.logos?.[0]?.href || "",
      gols: gol(adv),
      venceu: adv.winner,
    },
  };
}

async function buscaLiga(slug, nome) {
  const base = `https://site.api.espn.com/apis/site/v2/sports/soccer/${slug}/teams/${FLAMENGO_ID}/schedule`;
  const [passados, futuros] = await Promise.all([
    fetch(base).then((r) => r.json()).catch(() => ({})),
    fetch(base + "?fixture=true").then((r) => r.json()).catch(() => ({})),
  ]);
  const eventos = [...(passados.events || []), ...(futuros.events || [])];
  return eventos.map((e) => normalizaEvento(e, nome)).filter(Boolean);
}

async function carregaJogos() {
  let jogos = [];
  try {
    const partes = await Promise.all(LIGAS.map((l) => buscaLiga(l.slug, l.nome)));
    const vistos = new Set();
    jogos = partes.flat().filter((j) => (vistos.has(j.id) ? false : vistos.add(j.id)));
  } catch (e) {
    $("#proximoJogo").innerHTML = `<p class="aviso">Não consegui carregar os jogos. Tente atualizar.</p>`;
    $("#listaProximos").innerHTML = "";
    $("#listaResultados").innerHTML = "";
    return;
  }
  jogos.sort((a, b) => new Date(a.data) - new Date(b.data));

  const agora = Date.now();
  const aoVivo = jogos.filter((j) => j.estado === "in");
  const futuros = jogos.filter((j) => j.estado === "pre" && new Date(j.data) > agora - 3 * 3600e3);
  const passados = jogos.filter((j) => j.estado === "post").reverse();

  const destaque = aoVivo[0] || futuros[0];
  $("#proximoJogo").innerHTML = destaque ? cardDestaque(destaque) : `<p class="aviso">Nenhum jogo agendado no momento.</p>`;
  if (destaque && destaque.estado === "pre") iniciaContagem(new Date(destaque.data));

  const proximos = futuros.filter((j) => j !== destaque).slice(0, 6);
  $("#listaProximos").innerHTML = proximos.length
    ? proximos.map(linhaFuturo).join("")
    : `<p class="aviso">Sem jogos futuros publicados.</p>`;

  $("#listaResultados").innerHTML = passados.length
    ? passados.slice(0, 12).map(linhaResultado).join("")
    : `<p class="aviso">Sem resultados.</p>`;
}

function cardDestaque(j) {
  const d = new Date(j.data);
  const casa = j.casa ? j.fla : j.adv;
  const fora = j.casa ? j.adv : j.fla;
  const vivo = j.estado === "in";
  const meio = vivo
    ? `<div class="quando"><span class="ao-vivo">AO VIVO ${esc(j.detalhe)}</span>
         <div style="font-size:30px;font-weight:800;margin-top:12px;font-variant-numeric:tabular-nums">
           ${esc(casa.gols ?? "0")} <span style="color:var(--texto-fraco)">–</span> ${esc(fora.gols ?? "0")}
         </div></div>`
    : `<div class="quando">${fmtCompleto.format(d)}, ${fmtHora.format(d)}
         ${j.local ? `<span class="local">${esc(j.local)}${j.cidade ? " · " + esc(j.cidade) : ""}</span>` : ""}
       </div>
       <div class="contagem" id="contagem"></div>`;

  return `<div class="destaque">
    <div class="etiqueta">${vivo ? "Jogando agora" : "Próximo jogo"}</div>
    <div class="campeonato">${esc(j.liga)}</div>
    <div class="confronto">
      <div class="lado"><img src="${esc(casa.escudo)}" alt=""><div class="nome">${esc(casa.nome)}${j.casa ? mando(true) : ""}</div></div>
      <div class="versus">×</div>
      <div class="lado"><img src="${esc(fora.escudo)}" alt=""><div class="nome">${esc(fora.nome)}${j.casa ? "" : mando(false)}</div></div>
    </div>
    ${meio}
  </div>`;
}

let timerContagem = null;
function iniciaContagem(quando) {
  clearInterval(timerContagem);
  const alvo = document.getElementById("contagem");
  if (!alvo) return;
  const passo = () => {
    let s = Math.max(0, Math.floor((quando - Date.now()) / 1000));
    const dias = Math.floor(s / 86400); s -= dias * 86400;
    const h = Math.floor(s / 3600); s -= h * 3600;
    const m = Math.floor(s / 60); s -= m * 60;
    alvo.innerHTML = [[dias, "dias"], [h, "horas"], [m, "min"], [s, "seg"]]
      .map(([v, r]) => `<div><b>${String(v).padStart(2, "0")}</b><span>${r}</span></div>`)
      .join("");
  };
  passo();
  timerContagem = setInterval(passo, 1000);
}

function linhaFuturo(j) {
  const d = new Date(j.data);
  return `<div class="jogo">
    <div class="data"><b>${String(d.getDate()).padStart(2, "0")}</b><span>${fmtDiaMes.format(d).split(" ").pop().replace(".", "")}</span></div>
    <div class="meio">
      <div class="times"><img class="escudo-mini" src="${esc(j.adv.escudo)}" alt="">${esc(j.adv.nome)}${mando(j.casa)}</div>
      <div class="info">${esc(j.liga)} · ${fmtHora.format(d)}</div>
    </div>
  </div>`;
}

function linhaResultado(j) {
  const d = new Date(j.data);
  const gf = Number(j.fla.gols), ga = Number(j.adv.gols);
  const res = gf > ga ? ["v", "V"] : gf < ga ? ["d", "D"] : ["e", "E"];
  return `<div class="jogo">
    <div class="selo ${res[0]}">${res[1]}</div>
    <div class="meio">
      <div class="times"><img class="escudo-mini" src="${esc(j.adv.escudo)}" alt="">${esc(j.adv.nome)}${mando(j.casa)}</div>
      <div class="info">${esc(j.liga)} · ${fmtDiaMes.format(d)}</div>
    </div>
    <div class="placar">${esc(j.fla.gols ?? "-")}–${esc(j.adv.gols ?? "-")}</div>
  </div>`;
}

/* ---------- notícias ---------- */
const CHAVE_FONTES = "meufla.fontes";
const CHAVE_LIDAS = "meufla.lidas";
let noticias = [], fontes = [], desligadas = new Set(), lidas = new Set();

function leGuardado(chave) {
  // O acessor pode lançar em janela anônima ou com dados do site bloqueados.
  try { return new Set(JSON.parse(localStorage.getItem(chave) || "[]")); } catch (e) { return new Set(); }
}

function grava(chave, conjunto) {
  try { localStorage.setItem(chave, JSON.stringify([...conjunto])); } catch (e) {}
}

desligadas = leGuardado(CHAVE_FONTES);
lidas = leGuardado(CHAVE_LIDAS);

// Identidade da notícia. O link não serve: metade das fontes chega via Google
// News, com URLs opacas que podem ser reemitidas para o mesmo artigo. O título
// normalizado é o que o coletor já usa para deduplicar entre fontes.
function idNoticia(titulo) {
  const base = titulo.toLowerCase()
    .replace(/\s+-\s+[^-]+$/, "")
    .replace(/[^a-z0-9à-ú ]/g, "")
    .replace(/\s+/g, " ").trim();
  let h = 5381;
  for (let i = 0; i < base.length; i++) h = ((h * 33) ^ base.charCodeAt(i)) >>> 0;
  return h.toString(36);
}

async function carregaNoticias() {
  try {
    const dados = await fetch("data/news.json?" + Date.now()).then((r) => r.json());
    noticias = (dados.itens || []).map((n) => ({ ...n, id: idNoticia(n.titulo) }));
    marcaAtualizacao(dados.atualizadoEm);
    podaLidas();
    fontes = (dados.fontes || []).filter((f) => f.ok !== false);
    desenhaChips();
    desenhaNoticias();
  } catch (e) {
    marcaAtualizacao(null);
    $("#listaNoticias").innerHTML = `<p class="aviso">Notícias indisponíveis. Elas são atualizadas a cada 30 minutos.</p>`;
  }
}

// Mantém guardadas só as notícias que ainda estão no feed. Como o JSON tem no
// máximo 150 itens e eles envelhecem, o armazenamento se limita sozinho.
function podaLidas() {
  if (!lidas.size) return;
  const noFeed = new Set(noticias.map((n) => n.id));
  const antes = lidas.size;
  lidas = new Set([...lidas].filter((id) => noFeed.has(id)));
  if (lidas.size !== antes) grava(CHAVE_LIDAS, lidas);
}

function desenhaChips() {
  $("#chipsFontes").innerHTML = fontes
    .map((f) => `<button class="chip" data-fonte="${esc(f.id)}" aria-pressed="${!desligadas.has(f.id)}">${esc(f.nome)}</button>`)
    .join("");
}

function desenhaNoticias() {
  const visiveis = noticias.filter((n) => !desligadas.has(n.fonte));
  $("#listaNoticias").innerHTML = visiveis.length
    ? visiveis.slice(0, 80).map((n) => `
      <a class="noticia${lidas.has(n.id) ? " lida" : ""}" href="${esc(n.link)}" target="_blank" rel="noopener" data-id="${n.id}">
        <div class="cabeca">
          <span class="fonte">${esc(n.fonteNome)}</span>
          <span class="tempo">${tempoRelativo(n.data)}</span>
          <span class="marca-lida" role="button" aria-label="Marcar como lida"></span>
        </div>
        <h3>${esc(n.titulo)}</h3>
        ${n.resumo ? `<p>${esc(n.resumo)}</p>` : ""}
      </a>`).join("")
    : `<p class="aviso">Nenhuma fonte selecionada.</p>`;
}

$("#listaNoticias").addEventListener("click", (ev) => {
  const item = ev.target.closest(".noticia");
  if (!item) return;
  const id = item.dataset.id;

  // Toque no círculo: só alterna, sem abrir o link.
  if (ev.target.closest(".marca-lida")) {
    ev.preventDefault();
    ev.stopPropagation();
    lidas.has(id) ? lidas.delete(id) : lidas.add(id);
  } else {
    // Toque na manchete: o clique dispara antes de o link abrir.
    lidas.add(id);
  }
  item.classList.toggle("lida", lidas.has(id));
  grava(CHAVE_LIDAS, lidas);
});

$("#chipsFontes").addEventListener("click", (ev) => {
  const chip = ev.target.closest(".chip");
  if (!chip) return;
  const id = chip.dataset.fonte;
  desligadas.has(id) ? desligadas.delete(id) : desligadas.add(id);
  chip.setAttribute("aria-pressed", String(!desligadas.has(id)));
  localStorage.setItem(CHAVE_FONTES, JSON.stringify([...desligadas]));
  desenhaNoticias();
});

function marcaAtualizacao(iso) {
  const el = $("#atualizadoEm");
  if (!el) return;
  el.textContent = iso ? `Notícias atualizadas ${tempoRelativo(iso)}` : "Notícias indisponíveis";
}

/* ---------- ESPN: tabela e mata-mata ---------- */
// Faixas do Brasileirão. A ESPN não marca zonas, então ficam fixas aqui.
// Podem mudar no fim do ano conforme o campeão da Copa do Brasil.
const ZONAS_BR = [[1, 4, "z-liberta"], [5, 6, "z-pre"], [7, 12, "z-sula"], [17, 20, "z-queda"]];
const FASES = { "round-of-16": "Oitavas de final", quarterfinals: "Quartas de final", semifinals: "Semifinal", final: "Final" };
const ESPN_TABELA = "https://site.api.espn.com/apis/v2/sports/soccer";

function stat(entry, nome) {
  return entry.stats?.find((s) => s.name === nome)?.displayValue ?? "";
}

function normalizaLinha(entry) {
  const t = entry.team || {};
  return {
    id: t.id,
    nome: t.shortDisplayName || t.displayName || "",
    escudo: t.logos?.[0]?.href || "",
    pos: Number(stat(entry, "rank")),
    p: stat(entry, "points"),
    j: stat(entry, "gamesPlayed"),
    v: stat(entry, "wins"),
    e: stat(entry, "ties"),
    d: stat(entry, "losses"),
    sg: stat(entry, "pointDifferential"),
  };
}

function zonaBR(pos) {
  const z = ZONAS_BR.find(([a, b]) => pos >= a && pos <= b);
  return z ? z[2] : "";
}

function tabelaHTML(linhas, comZonas) {
  const tr = linhas.map((l) => `<tr class="${l.id === FLAMENGO_ID ? "fla " : ""}${comZonas ? zonaBR(l.pos) : ""}">
    <td class="pos">${l.pos}</td>
    <td class="time"><img class="escudo-mini" loading="lazy" src="${esc(l.escudo)}" alt="">${esc(l.nome)}</td>
    <td class="p">${esc(l.p)}</td><td>${esc(l.j)}</td><td>${esc(l.v)}</td><td>${esc(l.e)}</td><td>${esc(l.d)}</td><td>${esc(l.sg)}</td>
  </tr>`).join("");
  const legenda = comZonas
    ? `<div class="legenda">
        <span style="--cor:var(--verde)">Libertadores</span>
        <span style="--cor:rgba(47,191,106,.45)">Pré-Libertadores</span>
        <span style="--cor:var(--azul)">Sul-Americana</span>
        <span style="--cor:var(--vermelho)">Rebaixamento</span>
      </div>`
    : "";
  return `<table class="tabela">
    <thead><tr><th class="pos">#</th><th class="time">Time</th><th>P</th><th>J</th><th>V</th><th>E</th><th>D</th><th>SG</th></tr></thead>
    <tbody>${tr}</tbody>
  </table>${legenda}`;
}

function ehTBD(team) {
  return /^TBD\b/i.test(team?.shortDisplayName || team?.displayName || "");
}

// Junta ida e volta do mesmo confronto. A ESPN não numera as chaves, então o
// par de times é a identidade; quando os dois ainda são "TBD" (semis e final
// antes de definidos), pareia o n-ésimo jogo de ida com o n-ésimo de volta.
function agrupaConfrontos(eventos) {
  const grupos = new Map();
  const contador = {};
  for (const ev of eventos) {
    const c = ev.competitions?.[0];
    if (!c || c.competitors?.length !== 2) continue;
    const fase = ev.season?.slug;
    let chave;
    if (c.competitors.every((t) => ehTBD(t.team))) {
      const leg = c.leg?.displayValue || "x";
      contador[fase + leg] = (contador[fase + leg] || 0) + 1;
      chave = `${fase}:tbd:${contador[fase + leg]}`;
    } else {
      chave = `${fase}:${c.competitors.map((t) => t.team.id).sort().join("-")}`;
    }
    if (!grupos.has(chave)) grupos.set(chave, { fase, eventos: [] });
    grupos.get(chave).eventos.push(ev);
  }
  return [...grupos.values()];
}

function montaConfronto({ fase, eventos }) {
  const primeiro = eventos[0].competitions[0];
  const casa = primeiro.competitors.find((t) => t.homeAway === "home") || primeiro.competitors[0];
  const fora = primeiro.competitors.find((t) => t !== casa);
  const times = [casa, fora].map((t) => {
    const tbd = ehTBD(t.team);
    return {
      id: t.team.id,
      tbd,
      nome: tbd ? "A definir" : t.team.shortDisplayName || t.team.displayName,
      escudo: tbd ? "" : t.team.logo || "",
    };
  });

  const jogos = eventos.map((ev) => {
    const c = ev.competitions[0];
    const estado = c.status?.type?.state || "pre";
    const gols = times.map((t) => {
      if (t.tbd || estado === "pre") return null;
      const comp = c.competitors.find((x) => x.team.id === t.id);
      return comp?.score != null ? String(comp.score) : null;
    });
    return { data: c.date || ev.date, estado, gols };
  });

  const jogados = jogos.filter((j) => j.estado !== "pre");
  const agregado = jogados.length ? times.map((_, i) => jogados.reduce((s, j) => s + Number(j.gols[i] || 0), 0)) : null;

  const ultimo = eventos[eventos.length - 1].competitions[0];
  const serie = ultimo.series?.competitors || [];
  let vencedorId = serie.find((x) => x.winner)?.id || null;
  if (!vencedorId && eventos.length === 1 && ultimo.status?.type?.state === "post") {
    vencedorId = ultimo.competitors.find((x) => x.winner)?.team.id || null;
  }
  const pen = (ultimo.notes?.[0]?.headline || "").match(/(\d+)-(\d+) on penalties/);
  const vencedor = times.find((t) => t.id === vencedorId);

  return { fase, times, jogos, agregado, vencedorId, penaltis: pen && vencedor ? `${vencedor.nome} ${pen[1]}-${pen[2]}` : "" };
}

function quandoJogo(j, rotulo) {
  const d = new Date(j.data);
  const dia = fmtDiaMes.format(d).replace(" de ", " ").replace(".", "");  // "12 de ago." -> "12 ago"
  const txt = j.estado === "pre" ? `${dia} ${fmtHora.format(d)}` : dia;
  return rotulo ? `${rotulo} ${txt}` : txt;
}

function chaveHTML(cf) {
  const fla = cf.times.some((t) => t.id === FLAMENGO_ID);
  const idaVolta = cf.jogos.length > 1;
  const rotulos = idaVolta ? ["Ida", "Volta"] : ["Placar"];
  const cabeca = `<div class="time rotulos"><span class="nome"></span>${rotulos.map((r) => `<span class="placar-jogo">${r}</span>`).join("")}${idaVolta ? `<span class="agg">Total</span>` : ""}</div>`;
  const linhas = cf.times.map((t, i) => {
    const cls = ["time", t.tbd ? "tbd" : "", cf.vencedorId ? (cf.vencedorId === t.id ? "passou" : "fora") : ""].join(" ").trim();
    const placares = cf.jogos.map((j) => `<span class="placar-jogo">${j.gols[i] ?? "–"}</span>`).join("");
    const agg = idaVolta ? `<span class="agg">${cf.agregado ? cf.agregado[i] : "–"}</span>` : "";
    const escudo = t.escudo ? `<img loading="lazy" src="${esc(t.escudo)}" alt="">` : `<span class="vazio"></span>`;
    return `<div class="${cls}">${escudo}<span class="nome">${esc(t.nome)}</span>${placares}${agg}</div>`;
  }).join("");
  const aoVivo = cf.jogos.some((j) => j.estado === "in") ? `<span class="ao-vivo">Ao vivo</span>` : "";
  const datas = cf.jogos.map((j, i) => quandoJogo(j, idaVolta ? (i === 0 ? "Ida" : "Volta") : "")).join(" · ");
  const pen = cf.penaltis ? ` · Pênaltis ${esc(cf.penaltis)}` : "";
  return `<div class="chave${fla ? " fla" : ""}">${cabeca}${linhas}<div class="nota">${aoVivo}<span>${datas}${pen}</span></div></div>`;
}

function mataMataHTML(eventos) {
  const evs = eventos
    .filter((e) => FASES[e.season?.slug])
    .sort((a, b) => new Date(a.date) - new Date(b.date));
  if (!evs.length) return "";
  const temFla = (cf) => (cf.times.some((t) => t.id === FLAMENGO_ID) ? 1 : 0);
  const porFase = {};
  for (const cf of agrupaConfrontos(evs).map(montaConfronto)) {
    if (!porFase[cf.fase]) porFase[cf.fase] = [];
    porFase[cf.fase].push(cf);
  }

  return Object.keys(FASES).filter((f) => porFase[f]).map((f) => {
    const chaves = porFase[f].sort((a, b) => temFla(b) - temFla(a)).map(chaveHTML).join("");
    const concluida = porFase[f].every((cf) => cf.vencedorId);
    // Fase encerrada fica dobrada para o que está em jogo aparecer primeiro.
    if (concluida) {
      return `<details class="fase"><summary><h3 class="rodada">${FASES[f]} <span class="estado">· encerrada</span></h3></summary>${chaves}</details>`;
    }
    return `<h3 class="rodada">${FASES[f]}</h3>${chaves}`;
  }).join("");
}

async function carregaTabela() {
  const json = (url) => fetch(url).then((r) => r.json()).catch(() => ({}));
  const ano = new Date().getFullYear();
  // Julho a dezembro cobre oitavas até a final e deixa a fase de grupos de fora.
  const [br, lib] = await Promise.all([
    json(`${ESPN_TABELA}/bra.1/standings`),
    json(`https://site.api.espn.com/apis/site/v2/sports/soccer/conmebol.libertadores/scoreboard?dates=${ano}0701-${ano}1231&limit=100`),
  ]);

  const entradas = br.children?.[0]?.standings?.entries || [];
  $("#tabelaBrasileirao").innerHTML = entradas.length
    ? tabelaHTML(entradas.map(normalizaLinha), true)
    : `<p class="aviso">Não consegui carregar o Brasileirão. Tente atualizar.</p>`;

  const mata = mataMataHTML(lib.events || []);
  if (mata) {
    $("#tituloLibertadores").hidden = true;
    $("#tabelaLibertadores").innerHTML = mata;
    return;
  }
  // Sem mata-mata ainda (primeiro semestre): mostra o grupo do Flamengo.
  const grupos = await json(`${ESPN_TABELA}/conmebol.libertadores/standings`);
  const grupo = (grupos.children || []).find((g) => g.standings?.entries?.some((e) => e.team?.id === FLAMENGO_ID));
  if (grupo) {
    $("#tituloLibertadores").textContent = grupo.name.replace(/^Group/i, "Grupo");
    $("#tituloLibertadores").hidden = false;
    $("#tabelaLibertadores").innerHTML = tabelaHTML(grupo.standings.entries.map(normalizaLinha), false);
  } else {
    $("#tabelaLibertadores").innerHTML = `<p class="aviso">Não consegui carregar a Libertadores. Tente atualizar.</p>`;
  }
}

// Seletor de campeonato da aba Tabela. Abre no Brasileirão.
$("#chipsCampeonato").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  document.querySelectorAll("#chipsCampeonato .chip").forEach((c) => c.setAttribute("aria-pressed", String(c === chip)));
  document.querySelectorAll(".bloco-campeonato").forEach((c) => c.classList.toggle("ativo", c.id === "campeonato-" + chip.dataset.campeonato));
});

/* ---------- abas ---------- */
document.querySelectorAll('nav button').forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("nav button").forEach((b) => b.setAttribute("aria-selected", String(b === btn)));
    document.querySelectorAll(".painel").forEach((p) => p.classList.toggle("ativo", p.id === "painel-" + btn.dataset.painel));
    window.scrollTo({ top: 0 });
  });
});

// Escudo que falhou tenta de novo uma vez. Em rede móvel a aba Tabela pede
// dezenas de imagens à CDN da ESPN de uma vez e alguma cai; sem isso fica um
// buraco na linha até o app ser reaberto. O evento de erro de <img> não sobe,
// então o listener escuta na fase de captura.
document.addEventListener("error", (e) => {
  const img = e.target;
  if (img.tagName !== "IMG" || img.dataset.retentou) return;
  img.dataset.retentou = "1";
  const url = img.src.split("#")[0];
  setTimeout(() => { img.src = url + (url.includes("?") ? "&" : "?") + "r=1"; }, 1200);
}, true);

/* ---------- início ---------- */
async function carregaTudo() {
  const btn = $("#btnAtualizar");
  btn.classList.add("girando");
  try {
    await Promise.all([carregaJogos(), carregaNoticias(), carregaTabela()]);
    ultimaCarga = Date.now();
  } finally {
    setTimeout(() => btn.classList.remove("girando"), 400);
  }
}
$("#btnAtualizar").addEventListener("click", carregaTudo);

// Ao voltar para o app, recarrega tudo. O iOS mantém a PWA suspensa em vez de
// fechá-la, então sem isso o conteúdo poderia ficar parado por horas.
const RECARGA_MINIMA = 30000;
let ultimaCarga = 0;

function carregaSeVelho() {
  if (document.hidden) return;
  if (Date.now() - ultimaCarga < RECARGA_MINIMA) return;
  carregaTudo();
}

document.addEventListener("visibilitychange", carregaSeVelho);
window.addEventListener("pageshow", carregaSeVelho);
window.addEventListener("online", carregaSeVelho);

carregaTudo();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", async () => {
    try {
      const reg = await navigator.serviceWorker.register("sw.js");
      // Procura versão nova a cada retorno ao app.
      document.addEventListener("visibilitychange", () => { if (!document.hidden) reg.update(); });
    } catch (e) {}
  });
  // Quando um service worker novo assume, recarrega uma vez para o app já
  // rodar o código atual em vez de esperar a próxima abertura. Só vale quando
  // já havia um controlando: no primeiro acesso isso recarregaria à toa.
  // Logo depois de uma publicação o CDN do GitHub Pages pode entregar ora o
  // sw.js antigo, ora o novo; cada troca dispararia outra recarga e o app
  // ficaria num ciclo. Por isso, no máximo uma recarga automática a cada 5 min.
  if (navigator.serviceWorker.controller) {
    let recarregando = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (recarregando) return;
      let ultima = 0;
      try { ultima = Number(localStorage.getItem("ultimaRecarga")) || 0; } catch (e) {}
      if (Date.now() - ultima < 5 * 60000) return;
      try { localStorage.setItem("ultimaRecarga", String(Date.now())); } catch (e) {}
      recarregando = true;
      location.reload();
    });
  }
}
