name: Atualizar notícias

on:
  schedule:
    # Minutos 7 e 37 de propósito. O GitHub enfileira todas as tarefas do
    # planeta na virada da hora e na meia hora, e as execuções nesses horários
    # atrasam ou são descartadas. Fora dos picos, elas saem no horário.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar feeds
        run: python3 scripts/fetch.py

      - name: Commit se houver mudança
        run: |
          git config user.name "meu-fla-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "data: atualização automática $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
